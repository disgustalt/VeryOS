<!DOCTYPE html>
<html>
  <head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>VeryOS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <link href="./style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  </head>
  <body>
    <desktop>
      <div id="osscreen"></div>
      <div class="load" id="mainloader">
        <p class="txt" id="loadtxt">Loading :p</p>
        <div class="loader">
          <div class="bar" id="loadbar"></div>
        </div>
      </div>
      <apps>
        <div class="appcont" id="app-files">
          <div class="icon">
            <img src="./img/icons/filemanager.svg">
          </div>
          <p>Files</p>
        </div>
        <div class="appcont" id="app-camera">
          <div class="icon">
            <img src="./img/icons/camera.svg">
          </div>
          <p>Camera</p>
        </div>
        <div class="appcont" id="app-terminal">
          <div class="icon">
            <img src="./img/icons/terminal.svg">
          </div>
          <p>Terminal</p>
        </div>
      </apps>
    </desktop>
    <navbar>
      <img src="./img/logo.svg"
    </navbar>
  </body>
  <script type="module">
    import { get, set, del } from 'https://cdn.jsdelivr.net/npm/idb-keyval@6/+esm';
    window.db = {};
    window.db.add = set;
    window.db.get = get;
    window.db.del = del;
    window.db.set = set;
  </script>
  <script src="https://copy.sh/v86/build/libv86.js"></script>
  <script type="module" src="./scripts/os.js?v=7"></script>
  <script src="./script.js?v=0"></script>
  <script type="module" src="./scripts/apps/filemanager.js"></script>
  <script type="module" src="./scripts/apps/camera.js"></script>
  <script type="module" src="./scripts/apps/terminal.js?v=10"></script>
</html>
